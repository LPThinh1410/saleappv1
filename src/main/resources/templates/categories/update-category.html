<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Cập Nhật Ngành Hàng - SaleApp</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb text-muted small">
                    <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Trang chủ</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/categories}" class="text-decoration-none">Ngành hàng</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Chỉnh sửa</li>
                </ol>
            </nav>

            <div class="store-card">
                <div class="store-card-header bg-light">
                    <h5 class="fw-bold mb-0 text-dark">Cập Nhật Ngành Hàng</h5>
                    <small class="text-muted">Mã ngành: <strong th:text="'#' + ${category.id}">#1</strong></small>
                </div>

                <div class="p-4">
                    <form th:action="@{/categories/update/{id}(id=${category.id})}" th:object="${category}" method="post">
                        <input type="hidden" th:field="*{id}"/>
                        
                        <div class="mb-4">
                            <label for="name" class="form-label">Tên ngành hàng <span class="text-danger">*</span></label>
                            <input type="text" 
                                   id="name" 
                                   th:field="*{name}" 
                                   class="form-control" 
                                   placeholder="Tên ngành hàng" 
                                   required/>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="d-flex gap-2 justify-content-end pt-3 border-top">
                            <a th:href="@{/categories}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left me-1"></i> Quay lại
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle-fill me-1"></i> Lưu thay đổi
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
