<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Đăng Bán Sản Phẩm Mới - SaleApp</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb text-muted small">
                    <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Trang chủ</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/products}" class="text-decoration-none">Sản phẩm</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Đăng bán mới</li>
                </ol>
            </nav>

            <div class="store-card">
                <div class="store-card-header bg-light">
                    <h5 class="fw-bold mb-0 text-dark">Đăng Bán Sản Phẩm Mới</h5>
                    <small class="text-muted">Nhập thông tin sản phẩm và giá niêm yết bán lẻ</small>
                </div>

                <div class="p-4">
                    <form th:action="@{/products/add}" th:object="${product}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="name" class="form-label">Tên sản phẩm <span class="text-danger">*</span></label>
                                <input type="text" 
                                       th:field="*{name}" 
                                       class="form-control" 
                                       id="name" 
                                       placeholder="Ví dụ: iPhone 16 Pro Max 256GB" 
                                       required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="price" class="form-label">Giá niêm yết (₫) <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="number" 
                                           step="0.01" 
                                           th:field="*{price}" 
                                           class="form-control" 
                                           id="price" 
                                           placeholder="Ví dụ: 34990000" 
                                           required>
                                    <span class="input-group-text">₫</span>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                            </div>

                            <div class="col-md-12">
                                <label for="category" class="form-label">Ngành hàng <span class="text-danger">*</span></label>
                                <select th:field="*{category}" class="form-select" id="category" required>
                                    <option value="" disabled selected>-- Chọn ngành hàng --</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                                </select>
                                <div class="form-text small mt-1">
                                    Chưa có ngành hàng phù hợp? <a th:href="@{/categories/add}" class="text-primary text-decoration-none">Tạo ngành hàng mới</a>.
                                </div>
                            </div>

                            <div class="col-md-12">
                                <label for="description" class="form-label">Mô tả sản phẩm</label>
                                <textarea th:field="*{description}" 
                                          class="form-control" 
                                          id="description" 
                                          rows="4" 
                                          placeholder="Nhập cấu hình, đặc điểm nổi bật, chính sách bảo hành..."></textarea>
                            </div>
                        </div>

                        <div class="d-flex gap-2 justify-content-end pt-4 mt-3 border-top">
                            <a th:href="@{/products}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left me-1"></i> Quay lại
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i> Lưu Sản Phẩm
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
